name: Publish versioned release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify tag and artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,tomllib,json; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v"+v; assert json.load(open("web/package.json"))["version"] == v'
          python3 scripts/audit_release.py release-assets --checksums
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published assets.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "HKUST Canvas Workbench $RELEASE_TAG" --notes-file "docs/release-notes-${RELEASE_TAG}.md"
