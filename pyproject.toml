[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkust-canvas-mcp"
version = "2.0"
description = "Canvas MCP server for HKUST students"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "browser-cookie3==0.20.1",
  "canvasapi==3.4.0",
  "fastmcp==3.0.2",
  "jsonschema>=4.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
canvas = "canvas_cli:main"
canvas-mcp = "mcp_entry:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["canvas_mcp", "auth", "cli", "specs", "tools", "client", "schedule"]
py-modules = [
  "canvas_cli",
  "mcp_entry",
]
