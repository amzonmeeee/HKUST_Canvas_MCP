[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hkust-canvas-mcp"
version = "3.0.0"
description = "Local HKUST Canvas CLI, MCP server and AI study workbench"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "browser-cookie3==0.20.1",
  "canvasapi==3.4.0",
  "fastmcp==3.0.2",
  "jsonschema>=4.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.scripts]
canvas = "canvas_cli:main"
canvas-mcp = "mcp_entry:main"

[project.optional-dependencies]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
  "python-multipart>=0.0.20,<1",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "keyring>=25,<26",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1,<2",
  "python-multipart>=0.0.20,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["canvas_mcp", "auth", "cli", "specs", "tools", "client", "schedule", "webapp", "webapp.services"]
py-modules = [
  "canvas_cli",
  "mcp_entry",
]

[tool.setuptools.package-data]
webapp = ["static/index.html", "static/assets/*", "static/licenses/*", "prompts/*.md"]
